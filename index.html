<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <!-- Metatags para Mobile / PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    
    <title>Rastreador Mobile</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <!-- Bibliotecas externas (Apenas Leaflet e Gerador de SHP) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@mapbox/shp-write@0.4.3/shpwrite.min.js"></script>
</head>
<body>
    <!-- Barra Superior -->
    <div id="top-bar">
        <div><span>Tempo:</span> <span id="time">0</span>s</div>
        <div><span>Dist:</span> <span id="distance">0</span>m</div>
        <div><span>Prec:</span> <span id="accuracy">-</span>m</div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Barra Inferior -->
    <div id="bottom-bar">
        <button id="btn-start" class="btn-mobile">START</button>
        <button id="btn-pause" class="btn-mobile" disabled>PAUSE</button>
        <button id="btn-stop" class="btn-mobile" disabled>STOP</button>
    </div>

    <!-- Modal de Stop -->
    <div id="stop-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Finalizar Trajeto</h2>
            <input type="text" id="route-description" placeholder="Ex: roteiro com escola A">
            <button id="btn-continue" class="btn-mobile btn-confirm">CONTINUAR</button>
        </div>
    </div>

    <!-- Modal de Resultado (Sem o botão de compartilhar) -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Trajeto Concluído!</h2>
            <div class="result-buttons">
                <button id="btn-csv" class="btn-mobile">Download CSV</button>
                <button id="btn-shp" class="btn-mobile">Download SHP</button>
                <button id="btn-new" class="btn-mobile btn-new">NOVO TRAJETO</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
