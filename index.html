<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GPS Web Logger</title>


    <!-- CSS DO APP -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- LEAFLET -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>


    <!-- GERAÇÃO DE SHAPEFILE -->

    <script
        src="https://unpkg.com/@mapbox/shp-write@latest/shpwrite.js">
    </script>

</head>


<body>

    <!-- MAPA -->

    <div id="map"></div>


    <!-- PAINEL SUPERIOR -->

    <div id="infoPanel">

        <div id="status">
            Obtendo localização...
        </div>


        <div class="infoRow">

            <div>

                <span class="label">
                    Tempo
                </span>

                <strong id="duration">
                    00:00:00
                </strong>

            </div>


            <div>

                <span class="label">
                    Distância
                </span>

                <strong id="distance">
                    0 m
                </strong>

            </div>


            <div>

                <span class="label">
                    Registros
                </span>

                <strong id="pointCount">
                    0
                </strong>

            </div>

        </div>


        <div class="gpsInfo">

            <span>
                Precisão:
                <strong id="accuracy">--</strong>
            </span>

        </div>

    </div>


    <!-- CONTROLES INFERIORES -->

    <div id="controls">

        <button id="startBtn">

            START

        </button>


        <button
            id="pauseBtn"
            disabled
        >

            PAUSE

        </button>


        <button
            id="stopBtn"
            disabled
        >

            STOP

        </button>

    </div>


    <!-- METADADOS -->

    <div
        id="metadataPanel"
        class="modal hidden"
    >

        <div class="modalContent">

            <h2>
                Trajeto finalizado
            </h2>


            <p>

                Adicione uma descrição opcional.

            </p>


            <textarea
                id="description"
                placeholder="Descrição do trajeto..."
            ></textarea>


            <button id="saveMetadataBtn">

                CONTINUAR

            </button>

        </div>

    </div>


    <!-- EXPORTAÇÃO -->

    <div
        id="exportPanel"
        class="modal hidden"
    >

        <div class="modalContent">

            <h2>
                Exportar dados
            </h2>


            <button id="csvBtn">

                DOWNLOAD CSV

            </button>


            <button id="shpBtn">

                DOWNLOAD SHP

            </button>

        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
