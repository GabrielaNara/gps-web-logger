<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#ffffff">
    
    <title>Rastreador Mobile</title>
    
    <!-- BIBLIOTECAS LOCAIS (Não dependem de internet) -->
    <link rel="stylesheet" href="libs/leaflet.css" />
    <script src="libs/leaflet.js"></script>
    <script src="libs/shpwrite.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Barra Superior -->
    <div id="top-bar">
        <div><span>Tempo:</span> <span id="time">0</span>s</div>
        <div><span>Dist:</span> <span id="distance">0</span>m</div>
        <div><span>Prec:</span> <span id="accuracy">-</span>m</div>
    </div>

    <!-- Mapa -->
    <div id="map"></div>

    <!-- Barra Inferior -->
    <div id="bottom-bar">
        <button id="btn-start" class="btn-mobile">START</button>
        <button id="btn-pause" class="btn-mobile" disabled>PAUSE</button>
        <button id="btn-stop" class="btn-mobile" disabled>STOP</button>
    </div>

    <!-- Modal de Stop -->
    <div id="stop-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Finalizar Trajeto</h2>
            <input type="text" id="route-description" placeholder="Ex: teste5">
            <button id="btn-continue" class="btn-mobile btn-confirm">CONTINUAR</button>
        </div>
    </div>

    <!-- Modal de Resultado -->
    <div id="result-modal" class="modal hidden">
        <div class="modal-content">
            <h2>Trajeto Concluído!</h2>
            <div class="result-buttons">
                <button id="btn-csv" class="btn-mobile">Download CSV</button>
                <button id="btn-shp" class="btn-mobile">Download SHP</button>
                <button id="btn-new" class="btn-mobile btn-new">NOVO TRAJETO</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
